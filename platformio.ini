[platformio]
default_envs = cbu

; Development build: diagnostic logging on the serial port (115200 baud).
; Release build: pio run -e cbu_release -t upload
[env:cbu]
platform = kuba2k2/libretiny@1.14.0
board = cbu
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DLT_UART_DEFAULT_PORT=1
    ; see src/deep_sleep_fixup.c
    -Wl,--wrap=sddev_control
lib_deps = bblanchon/ArduinoJson@7.2.1

; The Beken SDK's default mbedTLS config only supports plain RSA key exchange
; with AES-CBC and has no SNI, which modern servers (AWS/tado) reject.
; Enable ECDHE + ECDSA + GCM + SNI. The overrides are injected into
; tls_config.h for both the SDK and the Arduino core, so struct layouts match.
custom_options.tls_config.h =
    MBEDTLS_ECDH_C = 1
    MBEDTLS_ECDSA_C = 1
    MBEDTLS_GCM_C = 1
    MBEDTLS_SHA512_C = 1
    MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED = 1
    MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED = 1
    MBEDTLS_SSL_SERVER_NAME_INDICATION = 1
    MBEDTLS_SSL_EXTENDED_MASTER_SECRET = 1
    MBEDTLS_SSL_CIPHERSUITES = MBEDTLS_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, MBEDTLS_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, MBEDTLS_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384, MBEDTLS_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, MBEDTLS_TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256, MBEDTLS_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256, MBEDTLS_TLS_RSA_WITH_AES_128_GCM_SHA256, MBEDTLS_TLS_RSA_WITH_AES_128_CBC_SHA256

; Silent build for deployment: no diagnostic logging from the firmware
; (DEBUG_LOG=0), LibreTiny (LT_LOGLEVEL) or the Beken SDK (LT_UART_SILENT_ALL).
; The tado login URL is still printed via Serial when a login is needed.
[env:cbu_release]
extends = env:cbu
build_flags =
    ${env:cbu.build_flags}
    -DDEBUG_LOG=0
    -DLT_LOGLEVEL=LT_LEVEL_NONE
    -DLT_UART_SILENT_ALL=1
